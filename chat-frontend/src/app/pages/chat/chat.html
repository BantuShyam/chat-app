<div class="chat-container">

  <div class="header">
    <h2>Spring Boot WebSocket Chat</h2>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <div class="chat-layout">

    <div class="sidebar">
      <h3>Online</h3>
      <div
        *ngFor="let user of onlineUsers()"
        class="user-item"
        [class.active]="user === receiver"
        (click)="selectUser(user)">
        {{user}}
      </div>
      <p *ngIf="onlineUsers().length === 0" class="empty">No one else online</p>
    </div>

    <div class="chat-panel">
      <h3 *ngIf="receiver">Chatting with {{receiver}}</h3>
      <p *ngIf="!receiver" class="empty">Select a user to start chatting</p>

      <div class="messages" *ngIf="receiver">
        <div
          *ngFor="let msg of messages(); trackBy: trackByIndex"
          class="message"
          [class.self]="msg.sender === username">
          <strong>{{msg.sender}}</strong>: {{msg.message}}
        </div>
      </div>

      <div class="send-box" *ngIf="receiver">
        <input
          [(ngModel)]="message"
          (keyup.enter)="send()"
          placeholder="Type message">
        <button (click)="send()">Send</button>
      </div>
    </div>

  </div>

</div>
